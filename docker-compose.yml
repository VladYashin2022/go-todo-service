version: '3.9'

services:
  db:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 76884
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: go_todo-api
    depends_on:
      - db
    environment:
      DB_URL: postgres://postgres:76884@db:5432/postgres?sslmode=disable
    ports:
      - "8080:8080"
    
volumes:
  postgres_data:
      